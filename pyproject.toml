[project]
name = "farm-twin"
version = "0.1.0"
description = "Python scientific foundation for the Farm Digital Twin"
requires-python = "==3.11.*"
dependencies = [
  "numpy==2.2.6",
  "pandas==2.2.3",
  "scipy==1.15.3",
  "pydantic==2.13.5",
  "pydantic-settings==2.12.0",
  "Pint==0.24.4",
  "SQLAlchemy==2.0.44",
  "GeoAlchemy2==0.20.0",
  "alembic==1.17.0",
  "psycopg[binary]==3.2.10",
  "shapely==2.1.2",
  "pyproj==3.7.2",
  "geopandas==1.1.1",
  "rasterio==1.4.3",
  "xarray==2025.10.1",
  "httpx==0.28.1",
  "tenacity==9.1.2",
  "pdfplumber==0.11.7",
  "pytesseract==0.3.13",
  "Pillow==11.3.0",
]

[project.optional-dependencies]
validation = ["pvlib==0.13.1"]
app = ["fastapi==0.162.2", "python-multipart==0.0.33", "streamlit==1.67.0", "uvicorn==0.54.0"]
agents = ["langgraph==1.2.20", "langgraph-checkpoint-postgres==3.2.0"]
planning = ["pyomo==6.10.1", "highspy==1.15.1"]
learning = ["emcee==3.1.6", "scikit-learn==1.9.1", "lightgbm==4.7.0"]
dev = [
  "pytest==8.4.2",
  "hypothesis==6.148.1",
  "testcontainers[postgres]==4.13.2",
  "mypy==1.18.2",
  "ruff==0.14.3",
]

[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["farm_twin*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
